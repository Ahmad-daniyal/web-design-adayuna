<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edquest — LMS Pembelajaran</title>
  <meta name="description" content="Learning Management System Edquest. Kelola kursus, jadwal, dan nilai dalam satu tempat yang fokus dan nyaman.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {} } }
  </script>
  <script>
    (function () {
      var saved = localStorage.getItem('edquest_dark');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'true' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
      if (localStorage.getItem('edquest_focus') === 'true') {
        document.documentElement.classList.add('focus-mode-ready');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="antialiased layout-wrapper">

  <div id="navbar-slot"></div>
  <div id="sidebar-slot"></div>
  <div id="auth-slot"></div>

  <main class="main-content">
    <div id="app"></div>
    <div id="footer-slot"></div>
  </main>

  <script src="component/navbar.js"></script>
  <script src="component/sidebar.js"></script>
  <script src="component/footer.js"></script>
  <script src="component/auth-modal.js"></script>

  <script src="page/home.js"></script>
  <script src="page/kursus.js"></script>
  <script src="page/jadwal.js"></script>
  <script src="page/nilai.js"></script>
  <script src="page/about.js"></script>
  <script src="page/forum.js"></script>
  <script src="page/friend.js"></script>
  <script src="page/faq.js"></script>
  <script src="page/profile.js"></script>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/forum.js"></script>
  <script src="js/friend.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/settings.js"></script>

  <script src="router.js"></script>
</body>
</html>
