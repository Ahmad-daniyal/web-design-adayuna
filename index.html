<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edquest — Komunitas Belajar Cerdas</title>
  <meta name="description" content="Mulai perjalanan belajarmu tanpa rasa malu. Forum diskusi, study buddy, dan progress tracking untuk siswa SMA/SMK.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {} } };
    (function () {
      if (localStorage.getItem('edquest_dark') === 'true' ||
          (!localStorage.getItem('edquest_dark') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      if (localStorage.getItem('edquest_focus') === 'true') {
        document.documentElement.classList.add('focus-mode-ready');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="antialiased layout-wrapper">
  <div id="navbar-slot"></div>
  <div id="sidebar-slot"></div>
  <div id="auth-slot"></div>
  <main class="main-content">
    <div id="app"></div>
    <div id="footer-slot"></div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
